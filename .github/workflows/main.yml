name: CI

on:
  repository_dispatch:
    types: docs
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Site
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Checkout NuttX repo
      uses: actions/checkout@v7
      with:
        repository: apache/nuttx
        fetch-depth: 0
        ref: master
        path: nuttx

    - uses: actions/setup-python@v7
      with:
        python-version: '3.10'   # EOL Oct 2026; test 3.12 before switching

    - name: Build docs
      env:
        PIPENV_VERBOSITY: -1
        PIPENV_IGNORE_VIRTUALENVS: 1   # one isolated env per NuttX release
      run: |
        echo "======================================================="
        echo " Install Pipenv"
        echo "======================================================="
        python3 -m venv .venv
        source .venv/bin/activate
        pip3 install pipenv

        echo "======================================================="
        echo " Install PlantUML"
        echo "======================================================="
        sudo apt-get update
        sudo apt-get install -y plantuml

        echo "======================================================="
        echo " Setup nuttx/Documentation"
        echo "======================================================="
        cd nuttx/Documentation
        DOCDIR=../../docs
        rm -rf $DOCDIR

        NUTTX_TAGS=$(git tag -l --sort=taggerdate 'nuttx-1?.*' | grep -Fv RC)
        export NUTTX_VERSIONS=$(echo -n "$NUTTX_TAGS" | sed -r 's|^nuttx-||g' | tr '\n' ',')
        echo " ==> BUILD NUTTX DOCUMENTATION FOR: $NUTTX_VERSIONS (and master)."

        for nuttx_version in $NUTTX_TAGS master; do
          echo " ===> BUILDING DOCUMENTATION FOR NuttX $nuttx_version."
          git checkout -f $nuttx_version

          echo " ====> PIPENV INSTALL."
          pipenv install
          pipenv run python -c "import sphinx; print(sphinx.__version__)" 2>/dev/null | grep -q '^4\.' && pipenv run pip install "sphinxcontrib-applehelp==1.0.4" "sphinxcontrib-devhelp==1.0.2" "sphinxcontrib-htmlhelp==2.0.1" "sphinxcontrib-qthelp==1.0.3" "sphinxcontrib-serializinghtml==1.1.5" || true

          if [ "$nuttx_version" = "master" ]; then
            OUTDIR="$DOCDIR/latest"
          else
            OUTDIR="$DOCDIR/${nuttx_version#nuttx-}"
          fi
          echo " ====> OUTDIR IS: $OUTDIR."

          if pipenv run make html BUILDDIR="$OUTDIR"; then
            mv $OUTDIR/html/* $OUTDIR
            rm -rf $OUTDIR/{html,doctrees}
          else
            if [ "$nuttx_version" = "master" ]; then
              echo "::error::Docs build failed for master"
              exit 1
            fi
            echo "::warning::Docs build failed for $nuttx_version, skipping"
            rm -rf "$OUTDIR"
          fi

          echo " ====> PIPENV CLEANUP."
          pipenv --rm || true
        done

        cd ../..
        echo " ========== DOCUMENTATION BUILD FINISHED ==========="

    - name: Install Ruby tools
      run: sudo apt-get install -y rubygems ruby-dev zlib1g-dev

    - name: Build Site
      run: |
        export GEM_HOME=$HOME/.gem
        export PATH=$PATH:$GEM_HOME/bin
        username="$(git log -1 --pretty=format:'%an')"
        email="$(git log -1 --pretty=format:'%ae')"
        git config --global user.name "$username"
        git config --global user.email "$email"
        ./publish.sh

    - name: Upload artifact of staged site
      uses: actions/upload-artifact@v7
      with:
        name: static-site
        path: content
        include-hidden-files: true

    - name: Publish Site
      if: (github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/master'
      run: git push origin asf-site:asf-site
