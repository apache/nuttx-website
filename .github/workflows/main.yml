name: CI

'on':
  repository_dispatch:
    types: docs
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Rebuild documentation for all historical releases'
        required: false
        default: false
        type: boolean
  pull_request:
  push:
    branches:
      - master
  schedule:
    # Full weekly rebuild on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
    # Daily incremental rebuild Monday through Saturday at 00:00 UTC
    - cron: '0 0 * * 1-6'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Site
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Checkout NuttX repo
      uses: actions/checkout@v7
      with:
        repository: apache/nuttx
        fetch-depth: 0
        ref: master
        path: nuttx

    - uses: actions/setup-python@v7
      with:
        python-version: '3.10'   # EOL Oct 2026; test 3.12 before switching

    - name: Build docs
      env:
        PIPENV_VERBOSITY: -1
        PIPENV_IGNORE_VIRTUALENVS: 1   # one isolated env per NuttX release
      run: |
        echo "======================================================="
        echo " Install Pipenv"
        echo "======================================================="
        python3 -m venv .venv
        source .venv/bin/activate
        pip3 install pipenv

        echo "======================================================="
        echo " Install PlantUML"
        echo "======================================================="
        sudo apt-get update
        sudo apt-get install -y plantuml

        echo "======================================================="
        echo " Setup docs directory"
        echo "======================================================="
        DOCDIR="$GITHUB_WORKSPACE/docs"
        rm -rf "$DOCDIR"
        mkdir -p "$DOCDIR"

        # Determine whether to perform a full historical rebuild or an incremental build.
        # - Full rebuild if workflow_dispatch input build_all is true.
        # - Full rebuild on weekly scheduled run (Sunday: cron '0 0 * * 0').
        # - Incremental build on PRs, pushes, repository_dispatch, and daily runs.
        BUILD_ALL=false
        if [ "${{ inputs.build_all }}" = "true" ]; then
          echo " ==> Full rebuild requested via workflow input."
          BUILD_ALL=true
        elif [ "${{ github.event.schedule }}" = "0 0 * * 0" ]; then
          echo " ==> Full weekly rebuild scheduled on Sunday."
          BUILD_ALL=true
        fi

        # In incremental mode, restore existing compiled docs from the asf-site branch
        if [ "$BUILD_ALL" != "true" ]; then
          echo "======================================================="
          echo " Restoring existing release docs from asf-site branch"
          echo "======================================================="
          git fetch origin asf-site --depth=1 || true
          if git archive origin/asf-site content/docs 2>/dev/null | tar -x -C "$DOCDIR" --strip-components=2 2>/dev/null; then
            echo " ==> Successfully restored existing release documentation."
          else
            echo "::warning::Could not restore docs from asf-site; falling back to full rebuild."
            BUILD_ALL=true
          fi
        fi

        echo "======================================================="
        echo " Select Documentation versions to build"
        echo "======================================================="
        cd nuttx/Documentation

        NUTTX_TAGS=$(git tag -l --sort=taggerdate 'nuttx-1?.*' | grep -Fv RC)
        export NUTTX_VERSIONS=$(echo -n "$NUTTX_TAGS" | sed -r 's|^nuttx-||g' | tr '\n' ',')

        VERSIONS_TO_BUILD=""
        if [ "$BUILD_ALL" = "true" ]; then
          echo " ==> FULL REBUILD: building all historical releases and master."
          VERSIONS_TO_BUILD="$NUTTX_TAGS master"
        else
          # Detect if any new release tags exist in NuttX that aren't yet in $DOCDIR
          for tag in $NUTTX_TAGS; do
            ver="${tag#nuttx-}"
            if [ ! -d "$DOCDIR/$ver" ]; then
              echo " ==> New release tag detected: $tag ($ver)"
              VERSIONS_TO_BUILD="$VERSIONS_TO_BUILD $tag"
            fi
          done
          # Always rebuild master (latest docs) to keep in sync with upstream
          VERSIONS_TO_BUILD="$VERSIONS_TO_BUILD master"
          echo " ==> INCREMENTAL BUILD: building $(echo $VERSIONS_TO_BUILD | xargs)."
        fi

        for nuttx_version in $VERSIONS_TO_BUILD; do
          echo " ===> BUILDING DOCUMENTATION FOR NuttX $nuttx_version."
          git checkout -f "$nuttx_version"

          echo " ====> PIPENV INSTALL."
          pipenv install
          pipenv run python -c "import sphinx; print(sphinx.__version__)" 2>/dev/null | grep -q '^4\.' && pipenv run pip install "sphinxcontrib-applehelp==1.0.4" "sphinxcontrib-devhelp==1.0.2" "sphinxcontrib-htmlhelp==2.0.1" "sphinxcontrib-qthelp==1.0.3" "sphinxcontrib-serializinghtml==1.1.5" || true

          if [ "$nuttx_version" = "master" ]; then
            OUTDIR="$DOCDIR/latest"
          else
            OUTDIR="$DOCDIR/${nuttx_version#nuttx-}"
          fi
          rm -rf "$OUTDIR"
          echo " ====> OUTDIR IS: $OUTDIR."

          if pipenv run make html BUILDDIR="$OUTDIR"; then
            mv $OUTDIR/html/* $OUTDIR
            rm -rf $OUTDIR/{html,doctrees}
          else
            if [ "$nuttx_version" = "master" ]; then
              echo "::error::Docs build failed for master"
              exit 1
            fi
            echo "::warning::Docs build failed for $nuttx_version, skipping"
            rm -rf "$OUTDIR"
          fi

          echo " ====> PIPENV CLEANUP."
          pipenv --rm || true
        done

        cd ../..
        echo " ========== DOCUMENTATION BUILD FINISHED ==========="

    - name: Install Ruby tools
      run: sudo apt-get install -y rubygems ruby-dev zlib1g-dev

    - name: Build Site
      run: |
        export GEM_HOME=$HOME/.gem
        export PATH=$PATH:$GEM_HOME/bin
        username="$(git log -1 --pretty=format:'%an')"
        email="$(git log -1 --pretty=format:'%ae')"
        git config --global user.name "$username"
        git config --global user.email "$email"
        ./publish.sh

    - name: Upload artifact of staged site
      uses: actions/upload-artifact@v7
      with:
        name: static-site
        path: content
        include-hidden-files: true

    - name: Publish Site
      if: (github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/master'
      run: git push origin asf-site:asf-site
