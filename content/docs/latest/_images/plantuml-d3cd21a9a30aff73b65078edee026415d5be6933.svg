serif" font-size="13" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="237" x="46" y="490.6138">but not necessarily the same thread:</text><text fill="#3F4757" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="182" x="46" y="505.7466">a handler may have made a</text><text fill="#3F4757" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="222" x="46" y="520.8794">higher-priority thread ready. NuttX</text><text fill="#3F4757" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="228" x="46" y="536.0122">switches to it unless sched_lock() is</text><text fill="#3F4757" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="253" x="46" y="551.145">held; under SMP the woken thread may</text><text fill="#3F4757" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="173" x="46" y="566.2778">go to another CPU instead.</text><text fill="#6B7689" font-family="sans-serif" font-size="11" lengthAdjust="spacingAndGlyphs" textLength="26" x="494.75" y="603.5542">later</text><path d="M740,639.1484 L740,664.1484 L941,664.1484 L941,649.1484 L931,639.1484 L740,639.1484 " fill="#FFFFFF" style="stroke: #C3CBD9; stroke-width: 1.0;"/><path d="M931,639.1484 L931,649.1484 L941,649.1484 L931,639.1484 " fill="#FFFFFF" style="stroke: #C3CBD9; stroke-width: 1.0;"/><text fill="#3F4757" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="176" x="750" y="656.2153">may block, may take a lock</text><path d="M743,674.2813 L743,714.2813 L937,714.2813 L937,684.2813 L927,674.2813 L743,674.2813 " fill="#FFFFFF" style="stroke: #C3CBD9; stroke-width: 1.0;"/><path d="M927,674.2813 L927,684.2813 L937,684.2813 L927,674.2813 " fill="#FFFFFF" style="stroke: #C3CBD9; stroke-width: 1.0;"/><text fill="#3F4757" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="169" x="753" y="691.3481">The device is served here,</text><text fill="#3F4757" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="161" x="753" y="706.481">where waiting is allowed.</text><!--MD5=[385adb1ab76283c4f1a0e0f4740649d2]
@startuml
skinparam shadowing false
skinparam defaultFontColor #1b2233
skinparam ArrowColor #4a5266
skinparam ArrowThickness 1.5
skinparam sequence {
  BoxBorderColor #c3cbd9
  BoxFontColor #6b7689
  ParticipantBackgroundColor #ffffff
  ParticipantBorderColor #3c34e3
  LifeLineBorderColor #4a5266
  LifeLineBackgroundColor #ffffff
  DividerBackgroundColor #f4f6fa
  DividerBorderColor #c3cbd9
  DividerFontColor #6b7689
  DelayFontColor #6b7689
}
skinparam participant<<hi>> {
  BackgroundColor #3c34e3
  BorderColor #2b2787
}
skinparam participant<<work>> {
  BorderColor #5a96bd
}
skinparam note {
  BackgroundColor #ffffff
  BorderColor #c3cbd9
  FontColor #3f4757
  FontStyle plain
}
skinparam sequenceMessageAlign right
hide stereotype
hide footbox


box "HARDWARE AND ARCHITECTURE ENTRY\narch/<arch>/src/" #f4f6fa
  participant "vector, save context" as ENT
end box
box "COMMON OS LOGIC\nsched/irq/" #f4f6fa
  participant "irq_dispatch()" as DIS
end box
box "INTERRUPT HANDLER\nmust not block, wait or allocate" #eef0fb
  participant "<color:#ffffff>the driver's handler" as HND <<hi>>
  participant "work_queue()" as WQ <<work>>
end box
box "BOTTOM HALF\na worker thread, later" #f4f6fa
  participant "the work queue thread" as WRK <<work>>
end box

[-> ENT : IRQ asserted\n<size:10><color:#5a6478> by a peripheral
activate ENT
note over ENT : <i> nesting is the exception
ENT -> DIS
activate DIS
note over DIS : <i> find the handler
DIS -> HND
activate HND
note over HND
  <i> clear the cause,
  <i> read the register
end note
HND -> WQ : <size:10><color:#5a6478> hand off everything\n<size:10><color:#5a6478> that can wait
note left of WQ
  <i><color:#2b2787>Hand off what can wait.</color></i>
end note
WQ ->> WRK
HND - -> DIS
deactivate HND
DIS - -> ENT
deactivate DIS

== RETURN FROM INTERRUPT ==

ENT -> ENT : restore context
note over ENT
  <i> but not necessarily the same thread:
  <i> a handler may have made a
  <i> higher-priority thread ready. NuttX
  <i> switches to it unless sched_lock() is
  <i> held; under SMP the woken thread may
  <i> go to another CPU instead.
end note
deactivate ENT

...later...

WQ -[hidden]> WRK
activate WRK
note over WRK
  <i> may block, may take a lock
end note
note over WRK
  <i> The device is served here,
  <i> where waiting is allowed.
end note

@enduml

