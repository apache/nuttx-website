="stroke: #4A5266; stroke-width: 1.0;" width="10" x="194.5" y="130.8438"/><rect fill="#FFFFFF" height="70.4141" style="stroke: #4A5266; stroke-width: 1.0;" width="10" x="194.5" y="331.25"/><path d="M12,51.2969 L76,51.2969 L76,58.2969 L66,68.2969 L12,68.2969 L12,51.2969 " fill="#F4F6FA" style="stroke: #C3CBD9; stroke-width: 1.0;"/><rect fill="none" height="421.1406" style="stroke: #C3CBD9; stroke-width: 2.0;" width="361" x="12" y="51.2969"/><text fill="#6B7689" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="19" x="27" y="64.3638">alt</text><text fill="#6B7689" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="243" x="91" y="63.5073">[Thread A does not hold sched_lock()]</text><rect fill="#FFFFFF" height="34" style="stroke: #3C34E3; stroke-width: 1.0;" width="97" x="36" y="73.4297"/><text fill="#1B2233" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="89" x="40" y="89.4966">Thread A runs</text><text fill="#5A6478" font-family="sans-serif" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="79" x="43" y="101.8447">interrupted here</text><polygon fill="#4A5266" points="182.5,126.8438,192.5,130.8438,182.5,134.8438,186.5,130.8438" style="stroke: #4A5266; stroke-width: 1.0;"/><line style="stroke: #4A5266; stroke-width: 1.5;" x1="85" x2="188.5" y1="130.8438" y2="130.8438"/><text fill="#5A6478" font-family="sans-serif" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="42" x="95" y="126.4854">interrupt</text><rect fill="#3C34E3" height="34" style="stroke: #3C34E3; stroke-width: 1.0;" width="186" x="106" y="143.8438"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="174" x="114" y="159.9106">handler, on top of Thread A</text><text fill="#D9D7FB" font-family="sans-serif" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="147" x="113" y="172.2588">nxsem_post(): Thread B ready</text><polygon fill="#4A5266" points="302.5,197.2578,312.5,201.2578,302.5,205.2578,306.5,201.2578" style="stroke: #4A5266; stroke-width: 1.0;"/><line style="stroke: #4A5266; stroke-width: 1.5;" x1="199.5" x2="308.5" y1="201.2578" y2="201.2578"/><text fill="#5A6478" font-family="sans-serif" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="30" x="209.5" y="196.8994">return</text><rect fill="#FFFFFF" height="34" style="stroke: #3C34E3; stroke-width: 1.0;" width="97" x="266" y="214.2578"/><text fill="#1B2233" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="89" x="270" y="230.3247">Thread B runs</text><text fill="#5A6478" font-family="sans-serif" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="62" x="273" y="242.6729">not Thread A</text><line style="stroke: #C3CBD9; stroke-width: 1.0; stroke-dasharray: 2.0,2.0;" x1="12" x2="373" y1="255.0313" y2="255.0313"/><text fill="#6B7689" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="190" x="17" y="265.2417">[Thread A holds sched_lock()]</text><rect fill="#FFFFFF" height="34" style="stroke: #3C34E3; stroke-width: 1.0;" width="97" x="36" y="273.8359"/><text fill="#1B2233" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="89" x="40" y="289.9028">Thread A runs</text><text fill="#5A6478" font-family="sans-serif" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="79" x="43" y="302.251">interrupted here</text><polygon fill="#4A5266" points="182.5,327.25,192.5,331.25,182.5,335.25,186.5,331.25" style="stroke: #4A5266; stroke-width: 1.0;"/><line style="stroke: #4A5266; stroke-width: 1.5;" x1="85" x2="188.5" y1="331.25" y2="331.25"/><text fill="#5A6478" font-family="sans-serif" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="42" x="95" y="326.8916">interrupt</text><rect fill="#3C34E3" height="34" style="stroke: #3C34E3; stroke-width: 1.0;" width="186" x="106" y="344.25"/><text fill="#FFFFFF" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="174" x="114" y="360.3169">handler, on top of Thread A</text><text fill="#D9D7FB" font-family="sans-serif" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="146" x="113" y="372.665">nxsem_post() wakes Thread B</text><polygon fill="#4A5266" points="96,397.6641,86,401.6641,96,405.6641,92,401.6641" style="stroke: #4A5266; stroke-width: 1.0;"/><line style="stroke: #4A5266; stroke-width: 1.5;" x1="90" x2="198.5" y1="401.6641" y2="401.6641"/><text fill="#5A6478" font-family="sans-serif" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="30" x="105" y="397.3057">return</text><rect fill="#FFFFFF" height="23" style="stroke: #3C34E3; stroke-width: 1.0;" width="125" x="22" y="414.6641"/><text fill="#1B2233" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="117" x="26" y="430.731">Thread A resumes</text><rect fill="#FFFFFF" height="19" style="stroke: #3C34E3; stroke-width: 1.0;" width="82" x="273" y="447.7969"/><text fill="#5A6478" font-family="sans-serif" font-size="10" lengthAdjust="spacingAndGlyphs" textLength="71" x="280" y="461.0791">Thread B waits</text><path d="M10,484.4375 L10,539.4375 L389,539.4375 L389,494.4375 L379,484.4375 L10,484.4375 " fill="#F4F6FA" style="stroke: #3C34E3; stroke-width: 1.0;"/><path d="M379,484.4375 L379,494.4375 L389,494.4375 L379,484.4375 " fill="#F4F6FA" style="stroke: #3C34E3; stroke-width: 1.0;"/><text fill="#3F4757" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="289" x="20" y="501.5044">Thread B has a higher priority than Thread A.</text><text fill="#3F4757" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="195" x="20" y="516.6372">Time runs from top to bottom.</text><text fill="#3F4757" font-family="sans-serif" font-size="13" font-style="italic" lengthAdjust="spacingAndGlyphs" textLength="354" x="20" y="531.77">Under SMP, Thread B may run on another CPU instead.</text><!--MD5=[480020ec064d703fc5a9ce969b899e8d]
@startuml
skinparam shadowing false
skinparam defaultFontColor #1b2233
skinparam ArrowColor #4a5266
skinparam ArrowThickness 1.5
skinparam sequence {
  ParticipantBackgroundColor #ffffff
  ParticipantBorderColor #3c34e3
  LifeLineBorderColor #4a5266
  LifeLineBackgroundColor #ffffff
  GroupBorderColor #c3cbd9
  GroupBackgroundColor #f4f6fa
  GroupHeaderFontColor #6b7689
  GroupFontColor #6b7689
}
skinparam participant<<hi>> {
  BackgroundColor #3c34e3
  BorderColor #2b2787
}
skinparam note {
  BackgroundColor #ffffff
  BorderColor #3c34e3
  FontStyle plain
}
hide stereotype
hide footbox


participant "Thread A" as A
participant "<color:#ffffff> interrupt handler" as H <<hi>>
participant "Thread B" as B

alt Thread A does not hold sched_lock()
  rnote over A
    Thread A runs
    <size:10><color:#5a6478> interrupted here
  end rnote
  A -> H : <size:10><color:#5a6478> interrupt
  activate H
  rnote over H #3c34e3
    <color:#ffffff> handler, on top of Thread A
    <size:10><color:#d9d7fb> nxsem_post(): Thread B ready
  end rnote
  H -> B : <size:10><color:#5a6478> return
  deactivate H
  rnote over B
    Thread B runs
    <size:10><color:#5a6478> not Thread A
  end rnote
else Thread A holds sched_lock()
  rnote over A
    Thread A runs
    <size:10><color:#5a6478> interrupted here
  end rnote
  A -> H : <size:10><color:#5a6478> interrupt
  activate H
  rnote over H #3c34e3
    <color:#ffffff> handler, on top of Thread A
    <size:10><color:#d9d7fb> nxsem_post() wakes Thread B
  end rnote
  H -> A : <size:10><color:#5a6478> return
  deactivate H
  rnote over A
    Thread A resumes
  end rnote
  rnote over B
    <size:10><color:#5a6478> Thread B waits
  end rnote
end

note across #f4f6fa
  <i><color:#3f4757> Thread B has a higher priority than Thread A.
  <i><color:#3f4757> Time runs from top to bottom.
  <i><color:#3f4757> Under SMP, Thread B may run on another CPU instead.
end note

@enduml

